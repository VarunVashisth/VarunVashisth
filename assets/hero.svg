  <g fill="none" stroke="url(#accent)" stroke-opacity=".7"><path d="M76 269C174 197 211 309 307 232S465 181 546 224"/><circle cx="76" cy="269" r="5" fill="#8b5cf6"/><circle cx="307" cy="232" r="5" fill="#22d3ee"/><circle cx="546" cy="224" r="5" fill="#34d399"/></g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle"><text x="600" y="139" fill="#f8fafc" font-size="58" font-weight="700" letter-spacing="2">VARUN VASHISTH</text><rect x="354" y="168" width="492" height="3" rx="2" fill="url(#accent)"/><text x="600" y="211" fill="#cbd5e1" font-size="21" letter-spacing="5">DEVELOPER  •  AI EXPLORER  •  BUILDER</text><text x="600" y="256" fill="#64748b" font-size="16" letter-spacing="2">turning curiosity into code</text></g>
  <g fill="#22d3ee"><circle cx="1020" cy="88" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.3s" repeatCount="indefinite"/></circle><circle cx="1070" cy="122" r="2"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1110" cy="74" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle></g>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
